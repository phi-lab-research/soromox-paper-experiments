[project]
name = "soromox-paper-experiments"
version = "1.0.0"
description = "Code, datasets, checkpoints, and figures for reproducing the SoRoMoX paper experiments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
  { name = "Maximilian Stölzle" },
  { name = "Solange Gribonval" },
  { name = "Daniel Feliu-Talegon" },
  { name = "Vito Daniele Perfetta" },
  { name = "Michele Martini" },
  { name = "Chuhan Zhang" },
  { name = "Kiwan Wong" },
  { name = "Daniela Rus" },
  { name = "Cosimo Della Santina" },
]
maintainers = [
  { name = "Maximilian Stölzle" },
]
dependencies = [
  "soromox[warp]==0.6.0",
  "cbfpy",
  "gymnasium",
  "ipython",
  "matplotlib",
  "numpy",
  "open3d>=0.20",
  "ipywidgets>=8.0.4",
  "opencv-python",
  "openpyxl",
  "optax",
  "optimistix",
  "pandas",
  "plotly",
  "pyelastica>=0.3.3.post2,<2",
  "seaborn",
  "stable-baselines3",
  "trimesh",
  "viser"
]

[project.optional-dependencies]
cuda13 = ["soromox[cuda13]==0.6.0"]
# Compatibility aliases for the commands preserved in the section READMEs.
paper_results = []
rendering = []
rl = []
test = ["pytest"]

[project.urls]
Source = "https://github.com/phi-lab-research/soromox-paper-experiments"
Library = "https://github.com/phi-lab-research/soromox"
Documentation = "https://phi-lab-research.github.io/soromox"
Paper = "https://doi.org/10.48550/arXiv.2608.06650"

[dependency-groups]
test = ["pytest", "ruff"]
paper-benchmarks = ["coomm @ git+https://github.com/mstoelzle/COOMM.git@0df454a44e70be941941be3c6b521b1cd891aef3"]

[tool.uv]
package = false

[tool.uv.sources]
open3d = [
    { path = "third_party/open3d", marker = "sys_platform == 'darwin' or sys_platform == 'win32' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64') and platform_python_implementation == 'CPython')" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "memory_intensive: opt-in tests requiring substantial JAX/XLA memory",
    "rendering_integration: opt-in tests requiring native graphics or video services",
    "slow: tests that integrate a full-length rollout",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
